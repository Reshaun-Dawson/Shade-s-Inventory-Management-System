<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Shade's Inventory Management - Detailed Daily Production Report form for daily production tracking.">
    <title>Detailed Daily Production Report</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        h2 { text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        .full-row { grid-column: 1 / 3; }
        .half-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .button-group { grid-column: 1 / 3; display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 10px 15px; border: none; cursor: pointer; }
        #loadButton { background-color: #007bff; color: white; }
        #submitButton { background-color: #4CAF50; color: white; }
        #status { grid-column: 1 / 3; margin-top: 15px; font-weight: bold; }
        #recordIdDisplay { grid-column: 1 / 3; font-size: 0.9em; color: #555; text-align: center; }
    </style>
</head>
<body>

    <h2>Detailed Daily Production Report</h2>
    <form id="dataForm">
        <input type="hidden" id="recordId" name="ID" value="">
        <div id="recordIdDisplay" class="full-row">Current Record ID: N/A (New Entry)</div>

        <div class="full-row half-row">
            <div>
                <label for="name">Name (Key for loading):</label>
                <input type="text" id="name" name="Name" required>
            </div>
            <div>
                <label for="shift">Shift:</label>
                <select id="shift" name="Shift" required>
                    <option value="">Select Shift</option>
                    <option value="A">8:30 - 4:30</option>
                    <option value="B">11:30 - 7:30</option>
                    
                </select>
            </div>
            <div>
                <label for="date">Date:</label>
                <input type="date" id="date" name="Date" required readonly>
            </div>
        </div>
        <div class="full-row">
            <button type="button" id="loadButton">Load Data by Name & Shift</button>
        </div>
        
        <hr class="full-row">

        <div><label for="meterin">Meter In (L):</label><input type="number" id="meterin" name="Meter In" required></div>
        <div><label for="meterout">Meter Out (L):</label><input type="number" id="meterout" name="Meter Out" required></div>
        <div><label for="capin">Cap In (Units):</label><input type="number" id="capin" name="Cap In" required></div>
        <div><label for="capout">Cap Out (Units):</label><input type="number" id="capout" name="Cap Out" required></div>
        
        <hr class="full-row">

        <div class="full-row"><h3>Product In/Out Counts</h3></div>
    <div><label for="500mlIn">500ml In:</label><input type="number" id="500mlIn" name="500ml In" required></div>
    <div><label for="500mlOut">500ml Out:</label><input type="number" id="500mlOut" name="500ml Out" required></div>
    <div><label for="1_5LIn">1.5L In:</label><input type="number" id="1_5LIn" name="1.5L In"></div>
    <div><label for="1_5LOut">1.5L Out:</label><input type="number" id="1_5LOut" name="1.5L Out"></div>
    <div><label for="5LIn">5L In:</label><input type="number" id="5LIn" name="5L In"></div>
    <div><label for="5LOut">5L Out:</label><input type="number" id="5LOut" name="5L Out"></div>
    <div><label for="fiveGallonIn">5 Gallon In:</label><input type="number" id="fiveGallonIn" name="5 Gallon In"></div>
    <div><label for="fiveGallonOut">5 Gallon Out:</label><input type="number" id="fiveGallonOut" name="5 Gallon Out"></div>
    <div><label for="vodaIn">Voda In:</label><input type="number" id="vodaIn" name="Voda In"></div>
    <div><label for="vodaOut">Voda Out:</label><input type="number" id="vodaOut" name="Voda Out"></div>
    <div><label for="fusionIn">Fusion In:</label><input type="number" id="fusionIn" name="Fusion In"></div>
    <div><label for="fusionOut">Fusion Out:</label><input type="number" id="fusionOut" name="Fusion Out"></div>
    <div><label for="uwiIn">Uwi In:</label><input type="number" id="uwiIn" name="Uwi In"></div>
    <div><label for="uwiOut">Uwi Out:</label><input type="number" id="uwiOut" name="Uwi Out"></div>
    <div><label for="shadesIn">Shades In:</label><input type="number" id="shadesIn" name="Shades In"></div>
    <div><label for="shadesOut">Shades Out:</label><input type="number" id="shadesOut" name="Shades Out"></div>
    <div><label for="1stCheckIn">1st Check In:</label><input type="number" id="1stCheckIn" name="1st Check In" required></div>
    <div><label for="2ndCheckOut">2nd Check Out:</label><input type="number" id="2ndCheckOut" name="2nd Check Out" required></div>
    <div><label for="totalCashSales">Total Cash Sales:</label><input type="number" id="totalCashSales" name="Total Cash Sales" required></div>
    <div><label for="totalCapSales">Total Cap Sales:</label><input type="number" id="totalCapSales" name="Total Cap Sales" required></div>


        <div class="button-group">
            <button type="submit" id="submitButton">Submit Report</button>
        </div>
    <div id="status" aria-live="polite"></div>
    </form>

    <script>
        // --- IMPORTANT: REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL ---
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxdYK8JcUpBsQJ1uThk7JryjEeL7hKsAAc9MiwXot8jRuSByCc5KntlaTzgZ2TU6-JKLg/exec'; 
        // ----------------------------------------------------------------------------------

        const form = document.getElementById('dataForm');
        const statusDiv = document.getElementById('status');
        const loadButton = document.getElementById('loadButton');
        const nameInput = document.getElementById('name');
        const shiftInput = document.getElementById('shift');
        const idInput = document.getElementById('recordId');
        const idDisplay = document.getElementById('recordIdDisplay');
        const dateInput = document.getElementById('date');

        // Autofill date field with today's date (YYYY-MM-DD)
        function setTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
        setTodayDate();

        // Helper function to set the form fields using a robust mapping
        function setFormFields(data) {
            // Map sheet/server keys to form element IDs
            const sheetToIdMap = {
                'ID': 'recordId',
                'Name': 'name',
                'Date': 'date',
                'Shift': 'shift',
                'Meter In': 'meterin',
                'Meter Out': 'meterout',
                'Cap In': 'capin',
                'Cap Out': 'capout',
                '500ml In': '500mlIn',
                '500ml Out': '500mlOut',
                '1.5L In': '1_5LIn',
                '1.5L Out': '1_5LOut',
                '5L In': '5LIn',
                '5L Out': '5LOut',
                '5 Gallon In': 'fiveGallonIn',
                '5 Gallon Out': 'fiveGallonOut',
                'Voda In': 'vodaIn',
                'Voda Out': 'vodaOut',
                'Fusion In': 'fusionIn',
                'Fusion Out': 'fusionOut',
                'Uwi In': 'uwiIn',
                'Uwi Out': 'uwiOut',
                'Shades In': 'shadesIn',
                'Shades Out': 'shadesOut',
                '1st Check In': '1stCheckIn',
                '2nd Check Out': '2ndCheckOut',
                'Total Cash Sales': 'totalCashSales',
                'Total Cap Sales': 'totalCapSales'
            };

            if (data && data.ID) {
                idInput.value = data.ID;
                idDisplay.textContent = `Current Record ID: ${data.ID} (Editing Existing Entry)`;
                Object.keys(sheetToIdMap).forEach(key => {
                    const el = document.getElementById(sheetToIdMap[key]);
                    if (el && data[key] !== undefined) {
                        el.value = data[key];
                    }
                });
                statusDiv.textContent = '✅ Data loaded successfully. ID recognized.';
            } else {
                // If no record is found, reset form except for Name/Shift
                idInput.value = '';
                idDisplay.textContent = 'Current Record ID: N/A (New Entry)';
                const currentName = nameInput.value;
                const currentShift = shiftInput.value;
                form.reset();
                nameInput.value = currentName;
                shiftInput.value = currentShift;
                statusDiv.textContent = '⚠️ No matching record found. Creating new entry.';
            }
        }

        // --- 1. Load Data Function (GET Request) ---
        loadButton.addEventListener('click', function() {
            const shift = shiftInput.value.trim();
            const date = dateInput.value.trim();
            if (!date || !shift) {
                statusDiv.textContent = 'Please enter both Date and Shift to load data.';
                return;
            }
            statusDiv.textContent = 'Loading data...';
            // Query by Date and Shift
            const queryURL = `${WEB_APP_URL}?date=${encodeURIComponent(date)}&shift=${encodeURIComponent(shift)}`;
            fetch(queryURL, { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    setFormFields(data);
                })
                .catch(error => {
                    console.error('Retrieval Error:', error);
                    statusDiv.textContent = '❌ Retrieval failed. Check console.';
                });
        });


        // --- 2. Submit Data Function (POST Request) ---
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            statusDiv.textContent = 'Submitting...';
            const formData = new FormData(form);
            const data = new URLSearchParams(formData);
            fetch(WEB_APP_URL, {
                method: 'POST',
                // mode: 'no-cors', // Removed for better error handling; add back ONLY if your server does not support CORS
                body: data
            })
            .then(response => {
                if (response.ok || response.type === 'opaque') {
                    statusDiv.textContent = '✅ Report successfully submitted/updated!';
                } else {
                    statusDiv.textContent = '❌ Submission may have failed. Check server.';
                }
            })
            .catch(error => {
                console.error('Submission Error:', error);
                statusDiv.textContent = '❌ Submission failed. Check console for details.';
            });
        });
    </script>
</body>
</html>
